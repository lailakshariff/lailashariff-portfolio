<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mobile preview</title>
<style>
  html,body{margin:0;background:#e9e7e2;font:400 11px/1 'Space Mono',ui-monospace,monospace;color:#4b4740}
  h2{font:400 11px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:#8a847c;margin:0 0 14px 2px}
  .band{padding:30px 30px 8px}
  .rail{display:flex;gap:30px;align-items:flex-start;overflow-x:auto;padding-bottom:24px}
  .dev{flex:none}
  .cap{letter-spacing:.13em;text-transform:uppercase;margin:0 0 9px 2px;color:#6b6660}
  .screen{border:1px solid rgba(34,32,29,.2);border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 16px 40px rgba(34,32,29,.13)}
  iframe{display:block;border:0}
</style>
</head>
<body>

<div class="band"><h2>Phone</h2><div class="rail">
  <div class="dev"><p class="cap">320 × 780</p><div class="screen"><iframe src="About.dc.html#before-you-go" width="320" height="780"></iframe></div></div>
  <div class="dev"><p class="cap">375 × 812</p><div class="screen"><iframe src="About.dc.html#before-you-go" width="375" height="812"></iframe></div></div>
  <div class="dev"><p class="cap">393 × 852</p><div class="screen"><iframe src="About.dc.html#before-you-go" width="393" height="852"></iframe></div></div>
  <div class="dev"><p class="cap">430 × 900</p><div class="screen"><iframe src="About.dc.html#before-you-go" width="430" height="900"></iframe></div></div>
</div></div>

<div class="band"><h2>Tablet</h2><div class="rail">
  <div class="dev"><p class="cap">744 × 1000</p><div class="screen"><iframe src="About.dc.html#before-you-go" width="744" height="1000"></iframe></div></div>
  <div class="dev"><p class="cap">834 × 1080</p><div class="screen"><iframe src="About.dc.html#before-you-go" width="834" height="1080"></iframe></div></div>
  <div class="dev"><p class="cap">1024 × 900</p><div class="screen"><iframe src="About.dc.html#before-you-go" width="1024" height="900"></iframe></div></div>
</div></div>

<div class="band"><h2>Phone — top of About</h2><div class="rail">
  <div class="dev"><p class="cap">375 × 812</p><div class="screen"><iframe src="About.dc.html" width="375" height="812"></iframe></div></div>
  <div class="dev"><p class="cap">393 × 852</p><div class="screen"><iframe src="Home.dc.html" width="393" height="852"></iframe></div></div>
  <div class="dev"><p class="cap">393 — Playground</p><div class="screen"><iframe src="Playground.dc.html" width="393" height="852"></iframe></div></div>
</div></div>

</body>
</html>
