<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile preview — Laila Shariff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#1b1a18;color:#f4f1ea;
       font:400 11px/1 'Space Mono',ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;
       display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;gap:40px;padding:32px 28px 64px}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px}
  figcaption{color:#8f8880}
  .device{position:relative;padding:12px;border-radius:44px;background:#0d0c0b;
          box-shadow:0 0 0 1px rgba(255,255,255,.09),0 34px 70px -20px rgba(0,0,0,.8)}
  .device::after{content:"";position:absolute;left:50%;top:24px;width:74px;height:22px;
                 transform:translateX(-50%);border-radius:99px;background:#0d0c0b;z-index:2}
  .device.tab{border-radius:26px;padding:14px}
  .device.tab::after{display:none}
  iframe{display:block;border:0;border-radius:33px;background:#fff}
  .device.tab iframe{border-radius:12px}
  .picker{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-bottom:6px}
  .picker button{font:inherit;letter-spacing:.14em;text-transform:uppercase;color:#f4f1ea;cursor:pointer;
            padding:10px 15px;border:1px solid rgba(244,241,234,.22);border-radius:99px;background:none;
            transition:background .25s,border-color .25s,color .25s}
  .picker button:hover{background:rgba(244,241,234,.1);border-color:rgba(244,241,234,.5)}
  .picker button[aria-current="true"]{background:#f4f1ea;color:#1b1a18;border-color:#f4f1ea}
</style>
</head>
<body>

<div class="picker" id="picker"></div>

<figure>
  <figcaption>iPhone · 390 × 844</figcaption>
  <div class="device"><iframe width="390" height="844" title="390px"></iframe></div>
</figure>

<figure>
  <figcaption>Small · 360 × 780</figcaption>
  <div class="device"><iframe width="360" height="780" title="360px"></iframe></div>
</figure>

<figure>
  <figcaption>Tablet · 768 × 900</figcaption>
  <div class="device tab"><iframe width="768" height="900" title="768px"></iframe></div>
</figure>

<script>
(function () {
  var pages = [
    ['Home', 'Home.dc.html'],
    ['Purple Fabric', 'Purple Fabric v2.dc.html'],
    ['SayPlay', 'SayPlay v2.dc.html'],
    ['NutriHealth', 'NutriHealth v2.dc.html'],
    ['About', 'About.dc.html'],
    ['Playground', 'Playground.dc.html']
  ];
  var picker = document.getElementById('picker');
  var frames = Array.prototype.slice.call(document.querySelectorAll('iframe'));
  var buttons = [];
  function load(i) {
    frames.forEach(function (f) { f.src = encodeURI(pages[i][1]); });
    buttons.forEach(function (b, n) { b.setAttribute('aria-current', n === i ? 'true' : 'false'); });
  }
  pages.forEach(function (p, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = p[0];
    b.addEventListener('click', function () { load(i); });
    picker.appendChild(b);
    buttons.push(b);
  });
  load(0);
})();
</script>

</body>
</html>
